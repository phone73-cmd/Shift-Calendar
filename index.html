<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4조 2교대 달력</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Dancing+Script:wght@600&display=swap">
<style>
  :root{
    /* 라이트 모드 기본값 (화이트 스와치) */
    --bg:#f6f4f0;
    --surface:#ffffff;
    --surface-muted:#f8f6f2;
    --border:#e4e0d7;
    --text:#211f1b;
    --text-muted:#847e72;
    --text-faint:#b7b0a2;
    --accent:#3d5a80;
    --accent-soft:#dbe4ee;
    --sun:#b5563f;
    --sat:#3d6a94;

    /* 라이트 모드 파스텔 근무 색상 (스와치와 무관하게 공통 적용) */
    --shift-day:#f3c9bd;
    --shift-night:#f6dcae;
    --shift-off:#c9e8d3;
    --shift-rest:#cddaf3;
    --shift-day-fg:#7a3423;
    --shift-night-fg:#7a5a17;
    --shift-off-fg:#2f6b47;
    --shift-rest-fg:#33518c;

    color-scheme: light;
  }
  /* JS가 붙기 전 첫 페인트에서 시스템이 다크면 잠깐이라도 다크로 보이게 하는 안전망 */
  @media (prefers-color-scheme: dark){
    :root:not([data-app-theme]){
      --bg:#15161a;
      --surface:#1c1e24;
      --surface-muted:#20222a;
      --border:#2d3038;
      --text:#edeef2;
      --text-muted:#93909f;
      --text-faint:#585864;
      --accent:#8db0dc;
      --accent-soft:#28374a;
      --sun:#e08669;
      --sat:#7aa8d6;

      --shift-day:#d97862;
      --shift-night:#dba24f;
      --shift-off:#5fa884;
      --shift-rest:#6b93c9;
      --shift-day-fg:#241110;
      --shift-night-fg:#241a08;
      --shift-off-fg:#0d1e16;
      --shift-rest-fg:#0e1a28;
      color-scheme: dark;
    }
  }
  :root[data-app-theme="dark"]{
    --bg:#15161a;
    --surface:#1c1e24;
    --surface-muted:#20222a;
    --border:#2d3038;
    --text:#edeef2;
    --text-muted:#93909f;
    --text-faint:#585864;
    --accent:#8db0dc;
    --accent-soft:#28374a;
    --sun:#e08669;
    --sat:#7aa8d6;

    --shift-day:#d97862;
    --shift-night:#dba24f;
    --shift-off:#5fa884;
    --shift-rest:#6b93c9;
    --shift-day-fg:#241110;
    --shift-night-fg:#241a08;
    --shift-off-fg:#0d1e16;
    --shift-rest-fg:#0e1a28;
    color-scheme: dark;
  }

  /* 라이트 모드 파스텔 배경 스와치 — 근무 색상은 공통, 배경/카드/테두리만 색상별로 달라짐 */
  :root[data-app-theme="light"][data-swatch="lavender"]{
    --bg:#ece3f8; --surface:#f8f4fc; --surface-muted:#f1e9f8; --border:#ddd0ef; --accent-soft:#e4d8f5;
  }
  :root[data-app-theme="light"][data-swatch="mint"]{
    --bg:#dff3e6; --surface:#f2faf5; --surface-muted:#e7f6ec; --border:#c9e8d4; --accent-soft:#cdeed9;
  }
  :root[data-app-theme="light"][data-swatch="peach"]{
    --bg:#fbe8db; --surface:#fdf5ef; --surface-muted:#faeee1; --border:#f3d3bb; --accent-soft:#f7dcc4;
  }
  :root[data-app-theme="light"][data-swatch="sky"]{
    --bg:#ddedf9; --surface:#f1f8fd; --surface-muted:#e7f3fb; --border:#c7dff2; --accent-soft:#d2e7f7;
  }
  :root[data-app-theme="light"][data-swatch="rose"]{
    --bg:#fbe2e8; --surface:#fdf2f4; --surface-muted:#fae8eb; --border:#f4c9d3; --accent-soft:#f8d5dd;
  }
  :root[data-app-theme="light"][data-swatch="butter"]{
    --bg:#faf3d9; --surface:#fdfaec; --surface-muted:#f8f1d6; --border:#f0e3ad; --accent-soft:#f5eec0;
  }

  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans KR","IBM Plex Sans",system-ui,sans-serif;
    padding-inline:16px;
    padding-block:16px 28px;
    max-width:480px;
    margin:0 auto;
    -webkit-tap-highlight-color:transparent;
    transition:background-color .15s ease;
  }
  h1,h2{text-wrap:balance; margin:0;}

  .app-title{
    font-family:"Sora",sans-serif;
    font-weight:700;
    font-size:1.6rem;
    letter-spacing:-0.01em;
    color:var(--text);
    text-align:center;
    margin-bottom:14px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .app-title:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:4px;
    border-radius:6px;
  }
  .app-title.falling-active{
    color:var(--accent);
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
  }
  .month-title{
    flex:1;
    font-family:"Sora",sans-serif;
    font-weight:700;
    font-size:1.35rem;
    text-align:center;
    letter-spacing:-0.01em;
  }
  .icon-btn{
    width:38px;height:38px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:1.05rem;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .icon-btn:active{ transform: translateY(1px); }

  .control-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .control-label{
    font-size:.78rem;
    color:var(--text-muted);
    font-weight:600;
    white-space:nowrap;
  }
  .team-select{
    display:flex;
    gap:4px;
    background:var(--surface-muted);
    border:1px solid var(--border);
    border-radius:10px;
    padding:3px;
  }
  .team-select button{
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-family:"IBM Plex Mono",monospace;
    font-weight:600;
    font-size:.82rem;
    padding:6px 10px;
    border-radius:7px;
    cursor:pointer;
  }
  .team-select button.active{
    background:var(--accent);
    color:var(--surface);
  }
  .today-btn{
    margin-left:auto;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:.78rem;
    font-weight:600;
    padding:7px 12px;
    border-radius:9px;
    cursor:pointer;
  }
  .today-btn.current-month{
    color:var(--text-faint);
  }

  .legend{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
    padding:10px 12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:.76rem;
    color:var(--text-muted);
    font-weight:500;
  }
  .legend-item i{
    width:10px;height:10px;
    border-radius:3px;
    display:inline-block;
  }
  .legend-item.day i{background:var(--shift-day);}
  .legend-item.night i{background:var(--shift-night);}
  .legend-item.off i{background:var(--shift-off);}
  .legend-item.rest i{background:var(--shift-rest);}
  .legend-note{
    margin-left:auto;
    font-size:.72rem;
    color:var(--text-faint);
    font-family:"IBM Plex Mono",monospace;
  }

  .calendar-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    touch-action:pan-y;
  }
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border-bottom:1px solid var(--border);
  }
  .weekday-row span{
    text-align:center;
    font-size:.72rem;
    font-weight:600;
    color:var(--text-muted);
    padding-block:9px;
  }
  .weekday-row span.sun{color:var(--sun);}
  .weekday-row span.sat{color:var(--sat);}

  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    transition:transform .16s ease, opacity .16s ease;
    will-change:transform;
  }
  @media (prefers-reduced-motion: reduce){
    .grid{ transition:none; }
  }
  .cell{
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:6px 3px 9px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    min-height:78px;
  }
  .cell:nth-child(7n){ border-right:none; }
  .cell.muted{ opacity:.4; }
  .cell.today{ background:var(--accent-soft); }

  .cell-date{
    font-family:"IBM Plex Mono",monospace;
    font-variant-numeric:tabular-nums;
    font-size:.78rem;
    font-weight:600;
    color:var(--text);
    align-self:flex-start;
    padding-left:2px;
  }
  .cell.muted .cell-date{ color:var(--text-faint); }
  .cell-date.sun{ color:var(--sun); }
  .cell-date.sat{ color:var(--sat); }

  .cell-shift{
    width:100%;
    text-align:center;
    font-size:.68rem;
    font-weight:700;
    padding:3px 0;
    border-radius:6px;
    letter-spacing:-0.01em;
  }
  .shift-day{ background:var(--shift-day); color:var(--shift-day-fg); }
  .shift-night{ background:var(--shift-night); color:var(--shift-night-fg); }
  .shift-off{ background:var(--shift-off); color:var(--shift-off-fg); }
  .shift-rest{ background:var(--shift-rest); color:var(--shift-rest-fg); }

  .cell-code{
    width:100%;
    text-align:center;
    font-family:"IBM Plex Mono",monospace;
    font-size:.65rem;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--text-muted);
    background:var(--surface-muted);
    border-radius:5px;
    padding:2px 0;
  }
  .cell.muted .cell-code{ color:var(--text-faint); }

  .settings-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
  }
  .settings-panel{
    width:100%;
    max-width:480px;
    max-height:88vh;
    overflow-y:auto;
    background:var(--surface);
    border-top-left-radius:20px;
    border-top-right-radius:20px;
    border:1px solid var(--border);
    padding:20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .settings-panel h2{
    font-family:"Sora",sans-serif;
    font-size:1.05rem;
    font-weight:700;
  }
  .settings-desc{
    font-size:.8rem;
    color:var(--text-muted);
    line-height:1.5;
    margin:0;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field span{
    font-size:.78rem;
    font-weight:600;
    color:var(--text-muted);
  }
  .field input, .field select{
    font-family:inherit;
    font-size:.9rem;
    padding:9px 10px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--surface-muted);
    color:var(--text);
  }
  .divider{
    border:none;
    border-top:1px solid var(--border);
    margin:2px 0;
  }
  .swatch-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .swatch-btn{
    width:30px;height:30px;
    border-radius:50%;
    border:2px solid var(--border);
    padding:0;
    cursor:pointer;
  }
  .swatch-btn.active{
    border-color:var(--accent);
    box-shadow:0 0 0 2px var(--accent-soft);
  }
  .settings-actions{
    display:flex;
    gap:8px;
    margin-top:4px;
  }
  .settings-actions button{
    flex:1;
    padding:11px;
    border-radius:10px;
    font-weight:700;
    font-size:.88rem;
    cursor:pointer;
    border:1px solid var(--border);
  }
  .btn-primary{
    background:var(--accent);
    color:var(--surface);
    border-color:var(--accent);
  }
  .btn-secondary{
    background:transparent;
    color:var(--text);
  }

  .signature{
    position:fixed;
    right:16px;
    bottom:calc(10px + env(safe-area-inset-bottom, 0px));
    font-family:"Dancing Script", cursive;
    font-weight:600;
    font-size:.92rem;
    line-height:1;
    color:var(--text-muted);
    opacity:.7;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    z-index:5;
  }
  .signature:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
    border-radius:4px;
  }

  #fxLayer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:6;
  }
  .fx-particle{
    position:absolute;
    font-size:1.15rem;
    transform:translate(-50%,-50%);
    animation-name:fx-burst;
    animation-timing-function:cubic-bezier(.17,.7,.4,1);
    animation-fill-mode:forwards;
    will-change:transform,opacity;
  }
  @keyframes fx-burst{
    0%{ transform:translate(-50%,-50%) translate(0,0) rotate(0deg) scale(.5); opacity:1; }
    100%{ transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1); opacity:0; }
  }
  .fx-petal{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
    will-change:transform,opacity;
  }
  .fx-petal.color-petal{
    border-radius:50%;
    border:1px solid rgba(80,50,60,.28);
    box-shadow:inset -2px -2px 3px rgba(0,0,0,.14);
  }
  .fx-petal.rain-streak{
    border-radius:999px;
    background:linear-gradient(to bottom, rgba(255,255,255,.85), rgba(120,175,222,.92));
  }
  @media (prefers-reduced-motion: reduce){
    .fx-particle, .fx-petal{ display:none; }
  }
</style>
</head>
<body>

<h1 class="app-title" id="appTitle" role="button" tabindex="0" aria-label="계절 효과 보기">교대근무 달력</h1>

<div class="topbar">
  <button class="icon-btn" id="prevMonth" aria-label="이전 달">‹</button>
  <div class="month-title" id="monthTitle">-</div>
  <button class="icon-btn" id="nextMonth" aria-label="다음 달">›</button>
</div>

<div class="control-row">
  <span class="control-label">근무조</span>
  <div class="team-select" id="teamSelect">
    <button data-team="A">A조</button>
    <button data-team="B">B조</button>
    <button data-team="C">C조</button>
    <button data-team="D">D조</button>
  </div>
  <button class="today-btn" id="todayBtn">오늘</button>
  <button class="icon-btn" id="settingsBtn" aria-label="설정">⚙</button>
</div>

<div class="legend">
  <span class="legend-item day"><i></i>주간</span>
  <span class="legend-item night"><i></i>야간</span>
  <span class="legend-item off"><i></i>비번</span>
  <span class="legend-item rest"><i></i>휴무</span>
  <span class="legend-note">코드: 주간조+야간조 (예 BC)</span>
</div>

<div class="calendar-card" id="calendarCard">
  <div class="weekday-row">
    <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
  </div>
  <div class="grid" id="calendarGrid"></div>
</div>

<div class="settings-overlay" id="settingsOverlay" hidden>
  <div class="settings-panel">
    <h2>화면 테마</h2>
    <label class="field">
      <span>테마 모드</span>
      <div class="team-select" id="themeModeSelect">
        <button data-mode="system">시스템</button>
        <button data-mode="light">라이트</button>
        <button data-mode="dark">다크</button>
      </div>
    </label>
    <div class="field" id="swatchField">
      <span>배경 색상 (라이트 모드 전용)</span>
      <div class="swatch-row" id="swatchRow"></div>
    </div>

    <hr class="divider">

    <h2>기준일 설정</h2>
    <p class="settings-desc">4조 2교대는 조마다 하루씩 밀려서 "주간 → 야간 → 비번 → 휴무"가 반복돼요. 기준 날짜에 한 조가 무슨 근무였는지 입력하면 전체 달력이 자동으로 계산돼요.</p>
    <label class="field">
      <span>기준 날짜</span>
      <input type="date" id="anchorDateInput">
    </label>
    <label class="field">
      <span>기준 조</span>
      <select id="anchorTeamInput">
        <option value="A">A조</option>
        <option value="B">B조</option>
        <option value="C">C조</option>
        <option value="D">D조</option>
      </select>
    </label>
    <label class="field">
      <span>그 날 기준 조의 근무</span>
      <select id="anchorShiftInput">
        <option value="0">주간</option>
        <option value="1">야간</option>
        <option value="2">비번</option>
        <option value="3">휴무</option>
      </select>
    </label>
    <div class="settings-actions">
      <button class="btn-secondary" id="closeSettings">닫기</button>
      <button class="btn-primary" id="applySettings">적용</button>
    </div>
  </div>
</div>

<div id="fxLayer" aria-hidden="true"></div>
<div class="signature" id="signature" role="button" tabindex="0" aria-label="깜짝 효과 보기">Design by JIPAPA</div>

<script>
(function(){
  var TEAMS = ['A','B','C','D'];
  var SHIFTS = [
    {key:'day',   label:'주간', cls:'shift-day'},
    {key:'night', label:'야간', cls:'shift-night'},
    {key:'off',   label:'비번', cls:'shift-off'},
    {key:'rest',  label:'휴무', cls:'shift-rest'}
  ];
  var THEME_MODES = ['system','light','dark'];
  var SWATCHES = [
    {key:'white',    label:'화이트', hex:'#f6f4f0'},
    {key:'lavender', label:'라벤더', hex:'#ece3f8'},
    {key:'mint',     label:'민트',   hex:'#dff3e6'},
    {key:'peach',    label:'피치',   hex:'#fbe8db'},
    {key:'sky',      label:'스카이', hex:'#ddedf9'},
    {key:'rose',     label:'로즈',   hex:'#fbe2e8'},
    {key:'butter',   label:'버터',   hex:'#faf3d9'}
  ];

  function pad(n){ return String(n).padStart(2,'0'); }
  function mod4(n){ return ((n % 4) + 4) % 4; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function sameDate(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function parseDateInput(v){
    var parts = v.split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  function daysBetween(a,b){
    var ms = new Date(b.getFullYear(),b.getMonth(),b.getDate()) - new Date(a.getFullYear(),a.getMonth(),a.getDate());
    return Math.round(ms / 86400000);
  }

  var today = new Date();
  // 2026-09-01 기준: B조 주간, C조 야간, D조 비번, A조 휴무 (사용자 확인 값)
  var state = {
    myTeam: 'D',
    anchorDate: new Date(2026, 8, 1),
    anchorTeam: 'B',
    anchorShiftIndex: 0,
    viewYear: 2026,
    viewMonth: 8,
    themeMode: 'light',
    swatch: 'lavender'
  };

  function loadState(){
    try{
      var raw = localStorage.getItem('shiftCalendarSettings');
      if(!raw) return;
      var saved = JSON.parse(raw);
      if(saved && TEAMS.indexOf(saved.myTeam) !== -1) state.myTeam = saved.myTeam;
      if(saved && TEAMS.indexOf(saved.anchorTeam) !== -1) state.anchorTeam = saved.anchorTeam;
      if(saved && typeof saved.anchorDate === 'string'){
        var d = parseDateInput(saved.anchorDate);
        if(!isNaN(d)) state.anchorDate = d;
      }
      if(saved && Number.isInteger(saved.anchorShiftIndex) && saved.anchorShiftIndex>=0 && saved.anchorShiftIndex<4){
        state.anchorShiftIndex = saved.anchorShiftIndex;
      }
      if(saved && THEME_MODES.indexOf(saved.themeMode) !== -1) state.themeMode = saved.themeMode;
      if(saved && SWATCHES.some(function(s){ return s.key === saved.swatch; })) state.swatch = saved.swatch;
    }catch(e){}
  }
  function saveState(){
    try{
      localStorage.setItem('shiftCalendarSettings', JSON.stringify({
        myTeam: state.myTeam,
        anchorDate: dateKey(state.anchorDate),
        anchorTeam: state.anchorTeam,
        anchorShiftIndex: state.anchorShiftIndex,
        themeMode: state.themeMode,
        swatch: state.swatch
      }));
    }catch(e){}
  }

  // 기준 조가 아닌 A조를 공통 기준으로 환산해두면 조 선택과 무관하게 항상 같은 결과가 나옴
  function anchorPhaseForA(){
    return mod4(state.anchorShiftIndex - TEAMS.indexOf(state.anchorTeam));
  }
  function shiftIndexFor(team, date){
    var diff = daysBetween(state.anchorDate, date);
    return mod4(anchorPhaseForA() + diff + TEAMS.indexOf(team));
  }

  var monthTitleEl = document.getElementById('monthTitle');
  var gridEl = document.getElementById('calendarGrid');
  var teamSelectEl = document.getElementById('teamSelect');
  var todayBtnEl = document.getElementById('todayBtn');
  var themeModeSelectEl = document.getElementById('themeModeSelect');
  var swatchRowEl = document.getElementById('swatchRow');
  var swatchFieldEl = document.getElementById('swatchField');

  SWATCHES.forEach(function(s){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'swatch-btn';
    btn.dataset.swatch = s.key;
    btn.style.background = s.hex;
    btn.setAttribute('aria-label', s.label);
    btn.title = s.label;
    swatchRowEl.appendChild(btn);
  });

  function renderTeamButtons(){
    Array.prototype.forEach.call(teamSelectEl.children, function(btn){
      btn.classList.toggle('active', btn.dataset.team === state.myTeam);
    });
  }

  var darkModeQuery = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)')) || null;

  function effectiveTheme(){
    if(state.themeMode === 'dark') return 'dark';
    if(state.themeMode === 'light') return 'light';
    return (darkModeQuery && darkModeQuery.matches) ? 'dark' : 'light';
  }

  function applyTheme(){
    var eff = effectiveTheme();
    document.documentElement.setAttribute('data-app-theme', eff);
    document.documentElement.setAttribute('data-swatch', state.swatch);

    Array.prototype.forEach.call(themeModeSelectEl.children, function(btn){
      btn.classList.toggle('active', btn.dataset.mode === state.themeMode);
    });
    Array.prototype.forEach.call(swatchRowEl.children, function(btn){
      btn.classList.toggle('active', btn.dataset.swatch === state.swatch);
    });
    swatchFieldEl.hidden = eff !== 'light';
  }

  if(darkModeQuery){
    var onSchemeChange = function(){ if(state.themeMode === 'system') applyTheme(); };
    if(darkModeQuery.addEventListener) darkModeQuery.addEventListener('change', onSchemeChange);
    else if(darkModeQuery.addListener) darkModeQuery.addListener(onSchemeChange);
  }

  function renderCalendar(){
    monthTitleEl.textContent = state.viewYear + '년 ' + (state.viewMonth+1) + '월';
    todayBtnEl.classList.toggle('current-month', state.viewYear === today.getFullYear() && state.viewMonth === today.getMonth());

    var firstOfMonth = new Date(state.viewYear, state.viewMonth, 1);
    var startDate = new Date(firstOfMonth);
    startDate.setDate(startDate.getDate() - firstOfMonth.getDay());

    var lastOfMonth = new Date(state.viewYear, state.viewMonth+1, 0);
    var totalCells = Math.ceil((firstOfMonth.getDay() + lastOfMonth.getDate()) / 7) * 7;

    var html = '';
    for(var i=0;i<totalCells;i++){
      var d = new Date(startDate);
      d.setDate(startDate.getDate() + i);
      var inMonth = d.getMonth() === state.viewMonth;
      var isToday = sameDate(d, today);
      var dow = d.getDay();

      var myIdx = shiftIndexFor(state.myTeam, d);
      var myShift = SHIFTS[myIdx];

      var dayTeam = '', nightTeam = '';
      TEAMS.forEach(function(t){
        var idx = shiftIndexFor(t, d);
        if(idx === 0) dayTeam = t;
        if(idx === 1) nightTeam = t;
      });
      var code = dayTeam + nightTeam;

      var dateCls = 'cell-date' + (dow===0?' sun':'') + (dow===6?' sat':'');

      html += '<div class="cell' + (inMonth?'':' muted') + (isToday?' today':'') + '">'
        + '<span class="'+dateCls+'">' + d.getDate() + '</span>'
        + '<span class="cell-shift ' + myShift.cls + '">' + myShift.label + '</span>'
        + '<span class="cell-code">' + code + '</span>'
        + '</div>';
    }
    gridEl.innerHTML = html;
  }

  function renderAll(){
    renderTeamButtons();
    renderCalendar();
    applyTheme();
  }

  var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var monthAnimLock = false;
  var SLIDE_DISTANCE = 22;

  function monthIndex(y, m){ return y * 12 + m; }

  function goToMonth(newYear, newMonth){
    var cur = monthIndex(state.viewYear, state.viewMonth);
    var target = monthIndex(newYear, newMonth);
    if(target === cur) return;
    var direction = target > cur ? 1 : -1;
    state.viewYear = newYear;
    state.viewMonth = newMonth;
    clearFallingEffect();

    if(prefersReducedMotion || monthAnimLock){
      renderCalendar();
      return;
    }

    monthAnimLock = true;
    var outX = direction > 0 ? -SLIDE_DISTANCE : SLIDE_DISTANCE;
    var inX = -outX;
    gridEl.style.transform = 'translateX(' + outX + 'px)';
    gridEl.style.opacity = '0';
    window.setTimeout(function(){
      renderCalendar();
      gridEl.style.transition = 'none';
      gridEl.style.transform = 'translateX(' + inX + 'px)';
      gridEl.style.opacity = '0';
      void gridEl.offsetWidth;
      gridEl.style.transition = '';
      gridEl.style.transform = 'translateX(0)';
      gridEl.style.opacity = '1';
      window.setTimeout(function(){ monthAnimLock = false; }, 170);
    }, 150);
  }

  function goToPrevMonth(){
    var m = state.viewMonth - 1, y = state.viewYear;
    if(m < 0){ m = 11; y -= 1; }
    goToMonth(y, m);
  }
  function goToNextMonth(){
    var m = state.viewMonth + 1, y = state.viewYear;
    if(m > 11){ m = 0; y += 1; }
    goToMonth(y, m);
  }
  document.getElementById('prevMonth').addEventListener('click', goToPrevMonth);
  document.getElementById('nextMonth').addEventListener('click', goToNextMonth);

  var calendarCardEl = document.getElementById('calendarCard');
  var swipeStartX = null, swipeStartY = null;
  var SWIPE_MIN_DISTANCE = 45;
  calendarCardEl.addEventListener('touchstart', function(e){
    var t = e.touches[0];
    swipeStartX = t.clientX;
    swipeStartY = t.clientY;
  }, {passive:true});
  calendarCardEl.addEventListener('touchend', function(e){
    if(swipeStartX === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - swipeStartX;
    var dy = t.clientY - swipeStartY;
    swipeStartX = null; swipeStartY = null;
    if(Math.abs(dx) < SWIPE_MIN_DISTANCE || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if(dx < 0) goToNextMonth();
    else goToPrevMonth();
  }, {passive:true});
  document.getElementById('todayBtn').addEventListener('click', function(){
    goToMonth(today.getFullYear(), today.getMonth());
  });
  teamSelectEl.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-team]');
    if(!btn) return;
    state.myTeam = btn.dataset.team;
    saveState();
    renderAll();
  });
  themeModeSelectEl.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-mode]');
    if(!btn) return;
    state.themeMode = btn.dataset.mode;
    saveState();
    applyTheme();
  });
  swatchRowEl.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-swatch]');
    if(!btn) return;
    state.swatch = btn.dataset.swatch;
    saveState();
    applyTheme();
  });

  var overlay = document.getElementById('settingsOverlay');
  var anchorDateInput = document.getElementById('anchorDateInput');
  var anchorTeamInput = document.getElementById('anchorTeamInput');
  var anchorShiftInput = document.getElementById('anchorShiftInput');

  document.getElementById('settingsBtn').addEventListener('click', function(){
    anchorDateInput.value = dateKey(today);
    anchorTeamInput.value = state.myTeam;
    anchorShiftInput.value = String(shiftIndexFor(state.myTeam, today));
    overlay.hidden = false;
  });
  document.getElementById('closeSettings').addEventListener('click', function(){
    overlay.hidden = true;
  });
  overlay.addEventListener('click', function(e){
    if(e.target === overlay) overlay.hidden = true;
  });
  document.getElementById('applySettings').addEventListener('click', function(){
    var v = anchorDateInput.value;
    if(v){
      var d = parseDateInput(v);
      if(!isNaN(d)) state.anchorDate = d;
    }
    state.anchorTeam = anchorTeamInput.value;
    state.anchorShiftIndex = parseInt(anchorShiftInput.value, 10);
    saveState();
    overlay.hidden = true;
    renderAll();
  });

  var fxLayerEl = document.getElementById('fxLayer');
  var signatureEl = document.getElementById('signature');
  var FX_EMOJIS = ['❤️','💖','💕','💗','💓'];
  var SUN_EMOJIS = ['☀️','✨','🌟','💛'];

  function spawnFx(x, y, emojiList){
    if(prefersReducedMotion) return;
    var list = emojiList || FX_EMOJIS;
    var count = 14;
    for(var i=0;i<count;i++){
      var el = document.createElement('span');
      el.className = 'fx-particle';
      el.textContent = list[Math.floor(Math.random()*list.length)];
      var angle = Math.random() * Math.PI * 2;
      var distance = 55 + Math.random()*95;
      var dx = Math.cos(angle) * distance;
      var dy = Math.sin(angle) * distance - 50;
      var rot = Math.round(Math.random()*320 - 160);
      var duration = 700 + Math.random()*500;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.setProperty('--dx', dx.toFixed(0) + 'px');
      el.style.setProperty('--dy', dy.toFixed(0) + 'px');
      el.style.setProperty('--rot', rot + 'deg');
      el.style.animationDuration = duration.toFixed(0) + 'ms';
      fxLayerEl.appendChild(el);
      el.addEventListener('animationend', function(){ this.remove(); });
    }
  }

  signatureEl.addEventListener('click', function(e){
    spawnFx(e.clientX, e.clientY);
  });
  signatureEl.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    var rect = signatureEl.getBoundingClientRect();
    spawnFx(rect.left + rect.width/2, rect.top + rect.height/2);
  });

  var appTitleEl = document.getElementById('appTitle');
  var activePetals = [];
  var landedPetals = [];
  var petalRafId = null;
  var fallingActive = false;
  var fallSpawnTimer = null;
  var sessionWindSign = 1;
  var sessionWindBase = 20;
  var sessionTilt = 0;
  var MAX_LANDED = 40;

  var FALL_PROFILES = {
    petal: { fallMin:30,  fallSpread:28, accelMin:3,  accelSpread:4,  swayAmpMin:10, swayAmpSpread:18, swayFreqMin:1.1, swayFreqSpread:1.5, rotMin:25, rotSpread:55, flip:true,  windMin:5, windSpread:8  },
    rain:  { fallMin:230, fallSpread:90, accelMin:15, accelSpread:20, swayAmpMin:2,  swayAmpSpread:4,  swayFreqMin:2,   swayFreqSpread:1,   rotMin:0,  rotSpread:0,  flip:false, windMin:2,  windSpread:4  },
    'rain-diagonal': { fallMin:260, fallSpread:80, accelMin:20, accelSpread:15, swayAmpMin:0, swayAmpSpread:0, swayFreqMin:1, swayFreqSpread:0, rotMin:0, rotSpread:0, flip:false, windMin:40, windSpread:35 },
    snow:  { fallMin:18,  fallSpread:20, accelMin:1,  accelSpread:2,  swayAmpMin:18, swayAmpSpread:16, swayFreqMin:0.8, swayFreqSpread:1.0, rotMin:10, rotSpread:20, flip:true,  windMin:6, windSpread:10 },
    leaf:  { fallMin:34,  fallSpread:30, accelMin:4,  accelSpread:5,  swayAmpMin:14, swayAmpSpread:20, swayFreqMin:1.3, swayFreqSpread:1.6, rotMin:40, rotSpread:80, flip:true,  windMin:6, windSpread:10 }
  };
  // 0=1월 ... 11=12월. 8월은 낙하가 아니라 태양 반짝임 버스트로 별도 처리.
  var MONTH_THEMES = [
    { emoji:['❄️'], profile:'snow'  },
    { emoji:['💮'], profile:'petal' },
    { emoji:['🌼'], profile:'petal' },
    { emoji:['🌸'], profile:'petal' },
    { emoji:['🌹'], profile:'petal' },
    { emoji:['💧'], profile:'rain'  },
    { streak:true,  profile:'rain-diagonal' },
    { emoji:null,   profile:'sun-burst' },
    { emoji:['🌸','💮','🌺'], profile:'petal' },
    { emoji:['🍂'], profile:'leaf'  },
    { emoji:['🍁'], profile:'leaf'  },
    { emoji:['❄️'], profile:'snow'  }
  ];
  function getMonthTheme(){
    return MONTH_THEMES[state.viewMonth];
  }

  function clearFallingEffect(){
    if(fallSpawnTimer){
      window.clearInterval(fallSpawnTimer);
      fallSpawnTimer = null;
    }
    fallingActive = false;
    appTitleEl.classList.remove('falling-active');
    if(petalRafId !== null){
      cancelAnimationFrame(petalRafId);
      petalRafId = null;
    }
    activePetals.forEach(function(p){ p.el.remove(); });
    activePetals.length = 0;
    landedPetals.forEach(function(entry){
      if(entry.timer) window.clearTimeout(entry.timer);
      entry.el.remove();
    });
    landedPetals.length = 0;
  }

  function getGroundY(){
    return window.innerHeight - 8;
  }

  function fadeAndRemove(entry){
    var idx = landedPetals.indexOf(entry);
    if(idx !== -1) landedPetals.splice(idx, 1);
    entry.el.style.transition = 'opacity 1.2s ease';
    entry.el.style.opacity = '0';
    window.setTimeout(function(){ entry.el.remove(); }, 1250);
  }

  function landPetal(el){
    var entry = { el: el, timer: null };
    entry.timer = window.setTimeout(function(){ fadeAndRemove(entry); }, 8000 + Math.random()*4000);
    landedPetals.push(entry);
    if(landedPetals.length > MAX_LANDED){
      var oldEntry = landedPetals.shift();
      window.clearTimeout(oldEntry.timer);
      fadeAndRemove(oldEntry);
    }
  }

  function petalLoop(now){
    var groundY = getGroundY();
    for(var i = activePetals.length - 1; i >= 0; i--){
      var p = activePetals[i];
      var t = (now - p.start) / 1000;
      if(t < 0) continue;
      if(t > p.maxLife){
        p.el.remove();
        activePetals.splice(i, 1);
        continue;
      }
      var y = -30 + p.fallSpeed * t + p.accel * t * t;
      var restY = groundY - p.restOffset;
      var maxX = window.innerWidth - 24;
      if(y >= restY){
        var landX = Math.max(4, Math.min(maxX, p.baseX + p.wind * t + p.swayAmp * Math.sin(p.swayFreq * t + p.swayPhase)));
        var landRot = ((p.rotSpeed * t) % 40) - 20 + (p.tilt || 0);
        p.el.style.opacity = '1';
        p.el.style.transform = 'translate(' + landX.toFixed(1) + 'px,' + restY.toFixed(1) + 'px) rotate(' + landRot.toFixed(1) + 'deg) scaleX(1)';
        activePetals.splice(i, 1);
        landPetal(p.el);
        continue;
      }
      var x = Math.max(4, Math.min(maxX, p.baseX + p.wind * t + p.swayAmp * Math.sin(p.swayFreq * t + p.swayPhase)));
      var rot = p.rotSpeed * t + (p.tilt || 0);
      var flip = p.flip ? Math.cos(p.flipFreq * t + p.flipPhase) : 1;
      var opacity = t < 0.3 ? t / 0.3 : 1;
      p.el.style.opacity = opacity.toFixed(2);
      p.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + rot.toFixed(1) + 'deg) scaleX(' + flip.toFixed(2) + ')';
    }
    if(activePetals.length > 0){
      petalRafId = requestAnimationFrame(petalLoop);
    } else {
      petalRafId = null;
    }
  }

  function spawnPetalBatch(count, theme, profile){
    var now = performance.now();
    for(var i=0;i<count;i++){
      var el = document.createElement('span');
      el.className = 'fx-petal';
      if(theme.streak){
        el.className += ' rain-streak';
        el.style.width = (2.5 + Math.random()*1.3).toFixed(1) + 'px';
        el.style.height = (16 + Math.random()*10).toFixed(1) + 'px';
      } else if(theme.colors){
        var size = (12 + Math.random()*8).toFixed(1) + 'px';
        el.className += ' color-petal';
        el.style.width = size;
        el.style.height = size;
        el.style.background = theme.colors[Math.floor(Math.random()*theme.colors.length)];
      } else {
        el.textContent = theme.emoji[Math.floor(Math.random()*theme.emoji.length)];
        el.style.fontSize = (0.9 + Math.random()*0.6).toFixed(2) + 'rem';
      }
      el.style.opacity = '0';
      el.style.transform = 'translate(-9999px,-9999px)';
      fxLayerEl.appendChild(el);
      activePetals.push({
        el: el,
        start: now + Math.random()*550,
        baseX: Math.random() * Math.max(1, window.innerWidth - 24),
        fallSpeed: profile.fallMin + Math.random()*profile.fallSpread,
        accel: profile.accelMin + Math.random()*profile.accelSpread,
        wind: sessionWindSign * sessionWindBase * (0.5 + Math.random()*0.9),
        swayAmp: profile.swayAmpMin + Math.random()*profile.swayAmpSpread,
        swayFreq: profile.swayFreqMin + Math.random()*profile.swayFreqSpread,
        swayPhase: Math.random()*Math.PI*2,
        rotSpeed: (Math.random()<0.5?-1:1) * (profile.rotMin + Math.random()*profile.rotSpread),
        tilt: sessionTilt,
        flip: profile.flip,
        flipFreq: 1.8 + Math.random()*2,
        flipPhase: Math.random()*Math.PI*2,
        restOffset: Math.random()*10,
        maxLife: 12
      });
    }
    if(petalRafId === null){
      petalRafId = requestAnimationFrame(petalLoop);
    }
  }

  function toggleFalling(){
    if(prefersReducedMotion) return;
    fallingActive = !fallingActive;
    appTitleEl.classList.toggle('falling-active', fallingActive);
    if(fallingActive){
      var theme = getMonthTheme();
      var profile = FALL_PROFILES[theme.profile];
      sessionWindSign = theme.profile === 'rain-diagonal' ? -1 : (Math.random() < 0.5 ? -1 : 1);
      sessionWindBase = profile.windMin + Math.random() * profile.windSpread;
      sessionTilt = theme.profile === 'rain-diagonal' ? sessionWindSign * (16 + Math.random()*8) : 0;
      spawnPetalBatch(1, theme, profile);
      fallSpawnTimer = window.setInterval(function(){ spawnPetalBatch(2, theme, profile); }, 680);
    } else if(fallSpawnTimer){
      window.clearInterval(fallSpawnTimer);
      fallSpawnTimer = null;
    }
  }

  appTitleEl.addEventListener('click', function(e){
    var theme = getMonthTheme();
    if(theme.profile === 'sun-burst'){
      spawnFx(e.clientX, e.clientY, SUN_EMOJIS);
    } else {
      toggleFalling();
    }
  });
  appTitleEl.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    var theme = getMonthTheme();
    if(theme.profile === 'sun-burst'){
      var rect = appTitleEl.getBoundingClientRect();
      spawnFx(rect.left + rect.width/2, rect.top + rect.height/2, SUN_EMOJIS);
    } else {
      toggleFalling();
    }
  });

  loadState();
  renderAll();
})();
</script>

</body>
</html>
